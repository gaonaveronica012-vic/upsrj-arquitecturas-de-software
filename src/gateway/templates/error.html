<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Error de Conexión</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8d7da;
            color: #721c24;
            padding: 2rem;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background-color: #f5c6cb;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
        }
        p {
            font-size: 1.1rem;
            text-align: center;
        }
        .details {
            margin-top: 1rem;
            background-color: #f1b0b7;
            padding: 1rem;
            border-radius: 6px;
            font-family: monospace;
            white-space: pre-wrap;
        }
        a {
            display: block;
            text-align: center;
            margin-top: 2rem;
            text-decoration: none;
            background-color: #721c24;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: bold;
        }
        a:hover {
            background-color: #501217;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Error al conectar con los microservicios</h1>
        <p>Ocurrió un problema al intentar obtener los datos de usuarios o productos.</p>
        <div class="details">
            {{ error }}
        </div>
        <a href="/">Volver al inicio</a>
    </div>
</body>
</html>
