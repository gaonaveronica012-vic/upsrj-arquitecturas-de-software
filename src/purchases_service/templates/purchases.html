<!DOCTYPE html>
<html>
<head>
    <title>Compras del Usuario</title>
</head>
<body>
    <h1>Compras del Usuario {{ user_id }}</h1>
    {% if purchases %}
        <ul>
        {% for purchase in purchases %}
            <li>Producto ID: {{ purchase.product_id }} | Fecha: {{ purchase.timestamp }}</li>
        {% endfor %}
        </ul>
    {% else %}
        <p>No hay compras registradas para este usuario.</p>
    {% endif %}
</body>
</html>
