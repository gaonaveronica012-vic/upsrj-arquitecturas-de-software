<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lista de Usuarios</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            padding: 2rem;
        }
        .container {
            max-width: 700px;
            margin: auto;
            background: #ffffff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            color: #333;
        }
        .user-card {
            background-color: #e9f5ff;
            padding: 1rem;
            border-radius: 6px;
            margin-top: 1rem;
        }
        form {
            margin-bottom: 2rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        input[type="text"] {
            padding: 0.5rem;
            border-radius: 4px;
            border: 1px solid #ccc;
            width: 100%;
            box-sizing: border-box;
        }
        input[type="submit"] {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            border: none;
            background-color: #28a745;
            color: white;
            font-weight: bold;
            cursor: pointer;
            width: 150px;
        }
        input[type="submit"]:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Usuarios</h2>

        <!-- Formulario para crear usuario -->
        <form method="POST" action="/users">
            <label for="name">Nombre del Usuario:</label>
            <input type="text" name="name" id="name" placeholder="Ingrese nombre" required>
            <input type="submit" value="Agregar Usuario">
        </form>

        <!-- Listado de usuarios -->
        {% if users %}
            {% for user in users %}
                <div class="user-card">
                    <p><strong>ID:</strong> {{ user.id }}</p>
                    <p><strong>Nombre:</strong> {{ user.name }}</p>
                </div>
            {% endfor %}
        {% else %}
            <p>No hay usuarios registrados.</p>
        {% endif %}
    </div>
</body>
</html>
